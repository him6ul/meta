global:
  scrape_interval: 5s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: meta-api-tester
    static_configs:
      - targets: ["app:8000"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: audit-shipper
    static_configs:
      - targets: ["audit-shipper:9102"]
