global:
  scrape_interval: 5s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  # One target per app replica (Docker DNS returns every replica's IP for "app").
  - job_name: meta-api-tester
    dns_sd_configs:
      - names: ["app"]
        type: A
        port: 8000
        refresh_interval: 15s
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: audit-gateway
    metrics_path: /metrics/
    static_configs:
      - targets: ["audit-gateway:9102"]
