groups:
  - name: meta-api
    rules:
      - alert: MetaApiHighErrorRate
        expr: |
          sum(rate(meta_api_requests_total{outcome!="success"}[5m]))
            / clamp_min(sum(rate(meta_api_requests_total[5m])), 1e-9) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Meta API failure rate above 5% ({{ $value | humanizePercentage }})"

      - alert: MetaApiRateLimitNear
        expr: max(meta_api_rate_limit_usage_percent) > 75
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Meta rate-limit usage at {{ $value }}% ({{ $labels.header }} {{ $labels.usage_type }}/{{ $labels.metric }})"

      - alert: MetaApiThrottled
        expr: sum(rate(meta_api_requests_total{outcome="throttled"}[5m])) > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Meta is throttling requests even after retries"

      - alert: MetaApiCircuitOpen
        expr: meta_api_circuit_state == 2
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "Meta API circuit breaker is OPEN - calls are failing fast"

      - alert: MetaApiHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(meta_api_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Meta API p95 latency {{ $value | humanizeDuration }}"

      - alert: MetaAccessTokenInvalid
        expr: sum(increase(meta_api_errors_total{code="190"}[5m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "Meta returned OAuth error 190 - access token expired or revoked"

      - alert: MetaWebhookBadSignatures
        expr: sum(increase(meta_webhook_events_total{signature="invalid"}[5m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "Webhook deliveries with invalid X-Hub-Signature-256"

      - alert: MetaApiTesterDown
        expr: up{job="meta-api-tester"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "meta-api-tester is not being scraped"

  - name: audit
    rules:
      - alert: AuditLogWriteFailing
        expr: sum(increase(audit_write_failures_total[5m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "Audit records are failing to persist - actions are not being recorded"

      - alert: UnauthenticatedApiAccess
        expr: sum(increase(audit_events_total{action="http.request", outcome="denied"}[5m])) > 10
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} denied API requests in 5m (bad or missing X-API-Key)"

      - alert: AuditArchiveDiverged
        expr: max(audit_ship_halted) == 1
        labels: {severity: critical}
        annotations:
          summary: "Audit shipping HALTED: local audit log no longer chains onto the S3 archive (possible tampering) - see audit-shipper logs"

      - alert: AuditArchiveLagging
        expr: max(audit_ship_lag_records) > 0 and (time() - max(audit_ship_last_success_timestamp_seconds)) > 300
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Audit records not archived to S3 for >5m ({{ $value }}s since last upload)"

      - alert: AuditArchiveUploadFailures
        expr: sum(increase(audit_ship_segments_total{outcome="failure"}[10m])) > 3
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} audit segment uploads to S3 failed in 10m"

      - alert: AuditShipperDown
        expr: up{job="audit-shipper"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "audit-shipper is down - audit records are not being archived"

      - alert: AuditJournalRefusingActions
        expr: sum(increase(audit_refused_actions_total[5m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "{{ $value }} actions refused in 5m because the S3 audit journal is unavailable (fail-closed)"

      - alert: AuditOutcomeUnrecorded
        expr: sum(increase(audit_outcome_unrecorded_total[10m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} actions completed but their outcome record is not durable (intent-only in archive)"

      - alert: AuditJournalSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(audit_journal_write_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Synchronous audit journal p95 {{ $value | humanizeDuration }} - every request pays this latency"

      - alert: AuditArchiveVerifyFailed
        expr: audit_archive_verify_ok == 0
        labels: {severity: critical}
        annotations:
          summary: "Scheduled audit archive verification FAILED - check audit-shipper /verify/last"

      - alert: AuditArchiveVerifyStale
        expr: time() - audit_archive_verify_last_run_timestamp_seconds > 2700
        labels: {severity: warning}
        annotations:
          summary: "Audit archive not verified for {{ $value | humanizeDuration }}"

      - alert: AuditOpenIntents
        expr: audit_archive_open_intents > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} durable intents have no recorded outcome (action result unknown)"

  - name: meta-token
    rules:
      - alert: MetaTokenInvalid
        expr: meta_token_valid{job="meta-api-tester"} == 0
        labels: {severity: critical}
        annotations:
          summary: "Meta reports the access token as INVALID - see /api/token-status"

      - alert: MetaTokenExpiringSoon
        expr: (meta_token_expires_timestamp_seconds - time()) < 7 * 86400 and meta_token_expires_timestamp_seconds > 0
        labels: {severity: warning}
        annotations:
          summary: "Meta access token expires in {{ $value | humanizeDuration }}"

      - alert: MetaTokenExpiresWithinADay
        expr: (meta_token_expires_timestamp_seconds - time()) < 86400 and meta_token_expires_timestamp_seconds > 0
        labels: {severity: critical}
        annotations:
          summary: "Meta access token expires in {{ $value | humanizeDuration }} - rotate now"

      - alert: MetaTokenDataAccessExpiringSoon
        expr: (meta_token_data_access_expires_timestamp_seconds - time()) < 7 * 86400 and meta_token_data_access_expires_timestamp_seconds > 0
        labels: {severity: warning}
        annotations:
          summary: "Meta data-access expires in {{ $value | humanizeDuration }} (user must re-authorise)"

      - alert: MetaTokenMissingScopes
        expr: meta_token_missing_required_scopes > 0
        labels: {severity: warning}
        annotations:
          summary: "Access token lacks {{ $value }} required permission(s) - see /api/token-status"

      - alert: MetaTokenCheckStale
        expr: (time() - meta_token_check_last_success_timestamp_seconds) > 3 * 3600 and meta_token_check_last_success_timestamp_seconds > 0
        labels: {severity: warning}
        annotations:
          summary: "Token health not confirmed for {{ $value | humanizeDuration }}"

  - name: meta-webhooks-and-delivery
    rules:
      - alert: MetaWebhookSignatureNotConfigured
        expr: sum(increase(meta_webhook_rejected_total{reason="signature_missing_secret"}[5m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "Webhooks rejected: META_APP_SECRET is not configured (Meta is retrying deliveries)"

      - alert: MetaWebhookRedeliveriesHigh
        expr: |
          sum(rate(meta_webhook_events_deduplicated_total[15m]))
            / clamp_min(sum(rate(meta_webhook_events_total[15m])), 1e-9) > 0.2
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanizePercentage }} of webhook events are redeliveries - are we acking slowly or failing?"

      - alert: WhatsAppDeliveryFailureRateHigh
        expr: |
          sum(rate(whatsapp_status_events_total{status="failed"}[15m]))
            / clamp_min(sum(rate(whatsapp_messages_sent_total[15m])), 1e-9) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "WhatsApp delivery failure rate {{ $value | humanizePercentage }} - see /api/whatsapp/delivery-stats"

      - alert: WhatsAppMessagesStuck
        expr: whatsapp_messages_stale_undelivered > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} WhatsApp messages accepted but not delivered after 10 minutes"

      - alert: MetaLocalRateLimiting
        expr: sum(increase(meta_api_local_rate_limited_total[5m])) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Calls are being refused locally to stay under Meta limits ({{ $value }} in 5m)"

  - name: secrets
    rules:
      - alert: SecretsRefreshFailing
        expr: sum(increase(secrets_refresh_failures_total[15m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "Secrets Manager refresh failing - running on cached secrets, rotations will not apply"
