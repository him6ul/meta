# Round-robin load balancer in front of the app replicas (docker compose `deploy.replicas`).
# `resolve` (nginx >= 1.27.3) re-resolves the service name, so scaled/restarted replicas are picked up.
worker_processes 1;
events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    log_format json escape=json '{"ts":"$time_iso8601","level":"INFO","logger":"lb","msg":"$request",'
                                '"status":$status,"upstream":"$upstream_addr","duration_s":$request_time,'
                                '"request_id":"$http_x_request_id"}';
    access_log /dev/stdout json;

    upstream app {
        zone app 64k;
        server app:8000 resolve;
        keepalive 32;
    }

    server {
        listen 8000;
        location = /lb/health { return 200 "ok\n"; }
        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            # Non-idempotent requests (POST) are never retried on another replica by default.
            proxy_next_upstream error timeout;
            add_header X-Served-By $upstream_addr always;
        }
    }
}
