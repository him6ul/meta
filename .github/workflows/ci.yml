name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      contract:
        description: "Also run live Meta contract tests (needs META_LIVE_* secrets)"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * *"   # daily: catches Meta API / token drift even without commits

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus rules
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v3.5.0 check rules /m/alerts.yml
      - name: Prometheus config
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config --syntax-only /etc/prometheus/prometheus.yml
      - name: Alertmanager config
        run: docker run --rm --entrypoint /bin/amtool -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Compose file
        run: docker compose config -q
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt / validate
        run: |
          for d in infra/*/; do
            (cd "$d" && terraform fmt -check && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done

  smoke:
    needs: [test, config]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Ready
        run: curl -fsS localhost:8000/ready
      - name: Traffic
        run: python scripts/loadgen.py --rps 5 --duration 30
      - name: Webhook path (signed, duplicate)
        run: |
          curl -fsS -XPOST 'localhost:8081/_mock/send-webhook?duplicate=true' | tee /tmp/wh.json
          grep -q '"status":200' /tmp/wh.json
      - name: Fail-closed when S3 is down
        run: |
          docker compose pause localstack
          code=$(curl -s -o /dev/null -w '%{http_code}' -XPOST localhost:8000/api/whatsapp/messages \
                  -H 'content-type: application/json' -d '{"to":"15550000001","text":"ci"}')
          docker compose unpause localstack
          test "$code" = "503"
      - name: Audit archive verifies
        run: |
          sleep 20
          docker compose exec -T audit-gateway sh -c 'python -m app.audit_gateway verify --compare-local /replicas/audit-*.jsonl' > /tmp/verify.json
          python -c "import json;r=json.load(open('/tmp/verify.json'));print(r['findings'], r['records_by_replica']);assert r['ok'],r['findings'];assert len(r['records_by_replica'])>=2,'expected records from 2 replicas'"
      - name: All scrape targets up
        run: |
          curl -fsS 'localhost:9090/api/v1/query?query=up' | python -c "import json,sys;r=json.load(sys.stdin)['data']['result'];down=[x['metric']['job'] for x in r if x['value'][1]!='1'];print('down:',down);assert not down"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  contract:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.contract)
    runs-on: ubuntu-latest
    environment: meta-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Live Meta contract tests (skip themselves when secrets are absent)
        env:
          META_LIVE_ACCESS_TOKEN: ${{ secrets.META_LIVE_ACCESS_TOKEN }}
          META_LIVE_APP_ID: ${{ secrets.META_LIVE_APP_ID }}
          META_LIVE_APP_SECRET: ${{ secrets.META_LIVE_APP_SECRET }}
          META_LIVE_WA_PHONE_ID: ${{ secrets.META_LIVE_WA_PHONE_ID }}
          META_LIVE_REQUIRED_SCOPES: ${{ vars.META_LIVE_REQUIRED_SCOPES }}
        run: pytest -m live tests/contract -v
