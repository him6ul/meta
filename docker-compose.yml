name: meta   # pinned: the log collector (alloy) filters on this project name

# Default: app talks to the bundled mock Meta server. For the real API, set
# META_GRAPH_BASE_URL=https://graph.facebook.com (and real credentials) in .env.
x-common-env: &meta-env
  META_APP_SECRET: ${META_APP_SECRET:-mock-app-secret}

services:
  # N stateless app replicas behind `lb`. The audit chain is sequenced by audit-gateway, so replicas
  # never coordinate with each other. Scale with: docker compose up -d --scale app=3
  app:
    build: .
    deploy:
      replicas: ${APP_REPLICAS:-2}
    # Trust X-Forwarded-For from the load balancer so audit records keep the real client IP.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file: [{path: .env, required: false}]
    environment:
      <<: *meta-env
      META_GRAPH_BASE_URL: ${META_GRAPH_BASE_URL:-http://mock-meta:8081}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-mock-token}
      META_APP_ID: ${META_APP_ID:-999}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-1098765}
      META_PAGE_ID: ${META_PAGE_ID:-2000001}
      INSTAGRAM_ACCOUNT_ID: ${INSTAGRAM_ACCOUNT_ID:-17841400000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Per-replica cache of that replica's committed records (the archive is the source of truth).
      AUDIT_LOG_PATH: /data/audit-{replica}.jsonl
      APP_API_KEYS: ${APP_API_KEYS:-}
      # Every record is sequenced by the gateway and committed to S3 Object Lock before the action
      # proceeds (fail-closed). AUDIT_JOURNAL_URL= (empty) = local single-writer mode (dev only).
      AUDIT_JOURNAL_URL: ${AUDIT_JOURNAL_URL-http://audit-gateway:9102}
      AUDIT_JOURNAL_TOKEN: ${AUDIT_JOURNAL_TOKEN:-local-dev-journal-token}
      # Shared by all replicas (a redelivery or status webhook can land on any replica).
      # SQLite on one host's volume is fine locally; use Redis/Postgres across hosts.
      META_WEBHOOK_DEDUP_PATH: /data/webhook_dedup.sqlite
      WHATSAPP_DELIVERY_DB_PATH: /data/deliveries.sqlite
      META_TOKEN_CHECK_INTERVAL_SECONDS: ${META_TOKEN_CHECK_INTERVAL_SECONDS:-300}
      META_REQUIRED_SCOPES: ${META_REQUIRED_SCOPES:-whatsapp_business_messaging}
      # Optional: load secrets from Secrets Manager (LocalStack has meta-api-tester/app pre-created).
      SECRETS_MANAGER_SECRET_ID: ${APP_SECRETS_MANAGER_SECRET_ID:-}
      SECRETS_MANAGER_ENDPOINT_URL: ${SECRETS_MANAGER_ENDPOINT_URL-http://localstack:4566}
      SECRETS_REFRESH_SECONDS: ${SECRETS_REFRESH_SECONDS:-60}
      AWS_ACCESS_KEY_ID: ${APP_AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${APP_AWS_SECRET_ACCESS_KEY:-test}
    volumes:
      - audit-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      mock-meta: {condition: service_started}
      jaeger: {condition: service_started}
      audit-gateway: {condition: service_healthy}

  lb:
    image: nginx:1.29-alpine
    ports: ["8000:8000"]
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/lb/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      app: {condition: service_healthy}

  mock-meta:
    build: .
    command: ["uvicorn", "mock_meta.server:app", "--host", "0.0.0.0", "--port", "8081"]
    ports: ["8081:8081"]
    environment:
      <<: *meta-env
      MOCK_WEBHOOK_TARGET: http://lb:8000/webhooks/meta

  loadgen:
    build: .
    profiles: [load]
    command: ["python", "scripts/loadgen.py", "--base", "http://lb:8000", "--rps", "5", "--duration", "3600"]
    depends_on: [lb]

  # Local stand-in for S3 with Object Lock (enforces COMPLIANCE retention). Ephemeral: the archive is
  # lost when this container is recreated. Point AUDIT_S3_* at a real bucket for durable storage.
  localstack:
    image: localstack/localstack:4.14
    ports: ["4566:4566"]
    environment:
      SERVICES: s3,secretsmanager
      AUDIT_S3_BUCKET: ${AUDIT_S3_BUCKET:-meta-audit-local}
      JOURNAL_TOKEN: ${AUDIT_JOURNAL_TOKEN:-local-dev-journal-token}
    volumes:
      - ./monitoring/localstack/init-audit-bucket.sh:/etc/localstack/init/ready.d/init-audit-bucket.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api get-object-lock-configuration --bucket $${AUDIT_S3_BUCKET} >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Audit gateway: the single global sequencer for the audit chain (group-commits blocks to S3 Object
  # Lock), global audit index/query API, scheduled archive verifier. Holds the only S3 credentials.
  audit-gateway:
    build: .
    command: ["python", "-m", "app.audit_gateway", "run"]
    environment:
      AUDIT_GATEWAY_STATE_DIR: /state
      AUDIT_S3_BUCKET: ${AUDIT_S3_BUCKET:-meta-audit-local}
      AUDIT_S3_PREFIX: ${AUDIT_S3_PREFIX:-audit/meta-api-tester}
      # Empty string = real AWS (credentials from env / instance role); unset = LocalStack.
      AUDIT_S3_ENDPOINT_URL: ${AUDIT_S3_ENDPOINT_URL-http://localstack:4566}
      AUDIT_S3_REGION: ${AUDIT_S3_REGION:-us-east-1}
      AUDIT_S3_LOCK_MODE: ${AUDIT_S3_LOCK_MODE:-COMPLIANCE}
      AUDIT_S3_RETENTION_DAYS: ${AUDIT_S3_RETENTION_DAYS:-1}
      AUDIT_S3_KMS_KEY_ID: ${AUDIT_S3_KMS_KEY_ID:-}
      AUDIT_COMMIT_WINDOW_SECONDS: ${AUDIT_COMMIT_WINDOW_SECONDS:-0.005}
      AWS_ACCESS_KEY_ID: ${AUDIT_AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AUDIT_AWS_SECRET_ACCESS_KEY:-test}
      AUDIT_JOURNAL_TOKEN: ${AUDIT_JOURNAL_TOKEN:-local-dev-journal-token}
      AUDIT_VERIFY_INTERVAL_SECONDS: ${AUDIT_VERIFY_INTERVAL_SECONDS:-300}
      SECRETS_MANAGER_SECRET_ID: ${GATEWAY_SECRETS_MANAGER_SECRET_ID:-}
      SECRETS_MANAGER_ENDPOINT_URL: ${SECRETS_MANAGER_ENDPOINT_URL-http://localstack:4566}
      SECRETS_REFRESH_SECONDS: ${SECRETS_REFRESH_SECONDS:-60}
    volumes:
      - gateway-state:/state
      - audit-data:/replicas:ro   # only for `verify --compare-local /replicas/audit-*.jsonl`
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9102/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    depends_on:
      localstack: {condition: service_healthy}

  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports: ["9093:9093"]
    environment:
      # Defaults to the mock's fake Slack endpoint; set a real incoming-webhook URL in .env.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-http://mock-meta:8081/_mock/slack}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$SLACK_WEBHOOK_URL" > /tmp/slack_webhook_url &&
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml
        --storage.path=/alertmanager --web.external-url=http://localhost:9093
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    depends_on: [mock-meta]

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [alertmanager]

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]

  loki:
    image: grafana/loki:3.5.3
    ports: ["3100:3100"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  # Ships container logs to Loki. Needs the Docker socket (read-only) for discovery: local use only.
  alloy:
    image: grafana/alloy:v1.10.2
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    ports: ["16686:16686", "4318:4318"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  audit-data:
  gateway-state:
  loki-data:
