# Default: app talks to the bundled mock Meta server. For the real API, set
# META_GRAPH_BASE_URL=https://graph.facebook.com (and real credentials) in .env.
x-common-env: &meta-env
  META_APP_SECRET: ${META_APP_SECRET:-mock-app-secret}

services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: [{path: .env, required: false}]
    environment:
      <<: *meta-env
      META_GRAPH_BASE_URL: ${META_GRAPH_BASE_URL:-http://mock-meta:8081}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-mock-token}
      META_APP_ID: ${META_APP_ID:-999}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-1098765}
      META_PAGE_ID: ${META_PAGE_ID:-2000001}
      INSTAGRAM_ACCOUNT_ID: ${INSTAGRAM_ACCOUNT_ID:-17841400000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      AUDIT_LOG_PATH: /data/audit.jsonl
      APP_API_KEYS: ${APP_API_KEYS:-}
    volumes:
      - audit-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: [mock-meta, jaeger]

  mock-meta:
    build: .
    command: ["uvicorn", "mock_meta.server:app", "--host", "0.0.0.0", "--port", "8081"]
    ports: ["8081:8081"]
    environment:
      <<: *meta-env
      MOCK_WEBHOOK_TARGET: http://app:8000/webhooks/meta

  loadgen:
    build: .
    profiles: [load]
    command: ["python", "scripts/loadgen.py", "--base", "http://app:8000", "--rps", "5", "--duration", "3600"]
    depends_on: [app]

  # Local stand-in for S3 with Object Lock (enforces COMPLIANCE retention). Ephemeral: the archive is
  # lost when this container is recreated. Point AUDIT_S3_* at a real bucket for durable storage.
  localstack:
    image: localstack/localstack:4.14
    ports: ["4566:4566"]
    environment:
      SERVICES: s3
      AUDIT_S3_BUCKET: ${AUDIT_S3_BUCKET:-meta-audit-local}
    volumes:
      - ./monitoring/localstack/init-audit-bucket.sh:/etc/localstack/init/ready.d/init-audit-bucket.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api get-object-lock-configuration --bucket $${AUDIT_S3_BUCKET} >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Tails the audit log (read-only) and archives it to S3 Object Lock. Holds the only S3 credentials.
  audit-shipper:
    build: .
    command: ["python", "-m", "app.audit_shipper", "run"]
    environment:
      AUDIT_LOG_PATH: /data/audit.jsonl
      AUDIT_SHIPPER_STATE_PATH: /state/shipper-state.json
      AUDIT_S3_BUCKET: ${AUDIT_S3_BUCKET:-meta-audit-local}
      AUDIT_S3_PREFIX: ${AUDIT_S3_PREFIX:-audit/meta-api-tester}
      # Empty string = real AWS (credentials from env / instance role); unset = LocalStack.
      AUDIT_S3_ENDPOINT_URL: ${AUDIT_S3_ENDPOINT_URL-http://localstack:4566}
      AUDIT_S3_REGION: ${AUDIT_S3_REGION:-us-east-1}
      AUDIT_S3_LOCK_MODE: ${AUDIT_S3_LOCK_MODE:-COMPLIANCE}
      AUDIT_S3_RETENTION_DAYS: ${AUDIT_S3_RETENTION_DAYS:-1}
      AUDIT_S3_KMS_KEY_ID: ${AUDIT_S3_KMS_KEY_ID:-}
      AUDIT_SHIP_FLUSH_SECONDS: ${AUDIT_SHIP_FLUSH_SECONDS:-10}
      AWS_ACCESS_KEY_ID: ${AUDIT_AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AUDIT_AWS_SECRET_ACCESS_KEY:-test}
    volumes:
      - audit-data:/data:ro
      - shipper-state:/state
    depends_on:
      localstack: {condition: service_healthy}
      app: {condition: service_started}

  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports: ["9093:9093"]
    environment:
      # Defaults to the mock's fake Slack endpoint; set a real incoming-webhook URL in .env.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-http://mock-meta:8081/_mock/slack}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$SLACK_WEBHOOK_URL" > /tmp/slack_webhook_url &&
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml
        --storage.path=/alertmanager --web.external-url=http://localhost:9093
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    depends_on: [mock-meta]

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [alertmanager]

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    ports: ["16686:16686", "4318:4318"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  audit-data:
  shipper-state:
