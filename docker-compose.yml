# Default: app talks to the bundled mock Meta server. For the real API, set
# META_GRAPH_BASE_URL=https://graph.facebook.com (and real credentials) in .env.
x-common-env: &meta-env
  META_APP_SECRET: ${META_APP_SECRET:-mock-app-secret}

services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: [{path: .env, required: false}]
    environment:
      <<: *meta-env
      META_GRAPH_BASE_URL: ${META_GRAPH_BASE_URL:-http://mock-meta:8081}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-mock-token}
      META_APP_ID: ${META_APP_ID:-999}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-1098765}
      META_PAGE_ID: ${META_PAGE_ID:-2000001}
      INSTAGRAM_ACCOUNT_ID: ${INSTAGRAM_ACCOUNT_ID:-17841400000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: [mock-meta, jaeger]

  mock-meta:
    build: .
    command: ["uvicorn", "mock_meta.server:app", "--host", "0.0.0.0", "--port", "8081"]
    ports: ["8081:8081"]
    environment:
      <<: *meta-env
      MOCK_WEBHOOK_TARGET: http://app:8000/webhooks/meta

  loadgen:
    build: .
    profiles: [load]
    command: ["python", "scripts/loadgen.py", "--base", "http://app:8000", "--rps", "5", "--duration", "3600"]
    depends_on: [app]

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    ports: ["16686:16686", "4318:4318"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
